name: leaderboard
# Regenerate docs/leaderboard.md weekly from the corpus-repair issues.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/corpus-issues/leaderboard.sh docs/leaderboard.md
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "leaderboard bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/leaderboard.md
          git diff --cached --quiet || { git commit -m "leaderboard: weekly regeneration" && git push; }
